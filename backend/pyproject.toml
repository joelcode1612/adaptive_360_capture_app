[build-system]
# Required for the `src/` layout. Without a build backend, uv (and pip) treat
# this as a "virtual" project: the dependencies get installed but `src/sitesense`
# is never put on `sys.path`, so `import sitesense` fails and every intra-project
# import shows up as an unresolved reference in the IDE.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitesense"]

[project]
name = "sitesense-backend"
version = "0.1.0"
description = "SiteSense API: resilient AR capture ingestion for panorama stitching."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pillow>=11,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 fires on `def get_db(db = Depends(get_session))`, which is FastAPI's
# documented dependency-injection form rather than a mutable-default bug.
ignore = ["B008"]
